which-inv-info: "{!ENV: MERRITT_INV_INFO !DEFAULT: inv-info-docker}"
  
inv-info-docker: &docker
  storageBase: "http://{!ENV: SVC_ACCESS !DEFAULT: store:8080/store}"
  state:
    id: inv
    name: UC3
    description: "UC3 inventory micro-service"
    baseURI: http://inventory:8080/inventory
  
  zooserver:
    queueService: "{!ENV: ZKCONN !DEFAULT: zoo:2181}"
    queueName: /mrt.inventory.full
    queueTimeout: 40000
    lockName: /mrt.lock

  zooclient:
    zooPollMilli: 60000
    zooThreadCount: 5

  fileLogger:
    messageMaximumLevel: 5
    messageMaximumError: 10
    path: /tdr/tmpdir
    name: inv
    qualifier: yyMMdd
    trace: 5 
    
  admin:
    ownerOwner: ark:/13030/j2rn30xp
    ownerCollection: ark:/13030/j2cc0900
    slaCollection: ark:/13030/j2h41690
    collectionCollection: ark:/13030/j27p88qw
    systemClasses: ark:/13030/j2mw23mp
    
  db:
    adapter: mysql2
    host: db-container
    name: inv
    user: user
    password: password
    encoding: "characterEncoding=UTF-8&characterSetResults=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"   # schema won't load if it's utf8mb4
  
inv-ecs: 
  <<: *docker

  db:
    user: "{!SSM: inv/readwrite/db-user}"
    password: "{!SSM: inv/readwrite/db-password}"
    host: "{!SSM: inv/db-host}"
    name: "{!SSM: inv/db-name}"
    encoding: "{!ENV: RDS_ENCODING !DEFAULT: characterEncoding=UTF-8&characterSetResults=UTF-8}"
